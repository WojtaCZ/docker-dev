name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild: picks up Arch package updates, which a change-triggered build
  # would never do on its own. promote-stable.yml runs after it (06:00 UTC Mondays).
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The unified image is several GB and `load: true` stores it twice (BuildKit
      # cache + Docker daemon), which does not fit beside the SDKs a hosted runner
      # ships with: the build dies with "no space left on device" while importing.
      # None of these are used here.
      - name: Free up runner disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/share/swift /usr/local/share/boost
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v4

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build into the local daemon first so the smoke test runs BEFORE anything
      # is published. Nothing reaches GHCR unless dev-doctor passes.
      - name: Build (local, for smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: dev-template:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint shell, JSON and compose assets
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh embedded/*.sh embedded/scripts/*.sh web/*.sh \
                                dev-doctor-checks/*.sh tools/*.sh tests/*.sh tests/unit/*.sh tests/smoke.d/*.sh
          for f in claude-baseline/settings.json embedded/profile.schema.json \
                   web/web-profile.schema.json embedded/profiles/*.json \
                   embedded/vscode-templates/*.json web/vscode-templates/*.json; do
            jq -e . "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
          docker compose -f compose/docker-compose.yml config > /dev/null
          echo "shell + JSON + compose assets OK"

      - name: Merge parity (repo)
        run: bash tests/merge-parity.sh repo

      - name: Unit tests (inside the built image)
        run: DEV_TEST_IMAGE=dev-template:ci bash tests/run-unit.sh

      - name: Smoke test
        run: |
          docker run --rm -e DEV_SKIP_UPDATE=1 \
            -v "$PWD/tests:/tests:ro" \
            dev-template:ci bash /tests/smoke.sh

      - name: Smoke test — UID remap path
        run: |
          docker run --rm --user 0:0 -e DEV_SKIP_UPDATE=1 \
            -e HOST_UID=1234 -e HOST_GID=1234 \
            dev-template:ci id | tee /dev/stderr | grep -q 'uid=1234'

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max