name: Promote to :stable

# The `:latest` tag moves on every green build of THIS repo. `:stable` moves only
# when the most recent completed build of the publish workflow on main succeeded.
# The unified image has no downstream images any more, so there is no matrix to check.
#
# Triggered by:
#   * schedule: weekly, an hour after the weekly rebuild.
#   * workflow_dispatch: manual promotion of a specific tag, no build check.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag to promote to :stable'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      # A scheduled promotion is only meaningful if the latest main build is green.
      # An unreadable result counts as not-green: skipping a promotion is cheap,
      # moving :stable onto an unverified digest is not.
      - name: Check the latest main build
        id: matrix
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/publish.yml/runs?branch=main&status=completed&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "unknown"' 2>/dev/null || echo unreadable)
          echo "publish.yml on main: $conclusion"
          if [ "$conclusion" = "success" ]; then green=true; else green=false; fi
          echo "green=$green" >> "$GITHUB_OUTPUT"
          if [ "$green" != "true" ]; then
            echo "::notice::latest main build is not green; leaving :stable where it is"
          fi

      - uses: docker/login-action@v4
        if: github.event_name != 'schedule' || steps.matrix.outputs.green == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve source tag
        id: src
        if: github.event_name != 'schedule' || steps.matrix.outputs.green == 'true'
        run: |
          TAG="${{ github.event.inputs.source_tag || 'latest' }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Promoting ghcr.io/${{ github.repository }}:$TAG -> :stable"

      - name: Retag as :stable
        if: github.event_name != 'schedule' || steps.matrix.outputs.green == 'true'
        run: |
          IMAGE="ghcr.io/${{ github.repository }}"
          # imagetools create re-points a tag at an existing manifest without
          # rebuilding or re-uploading any layers.
          docker buildx imagetools create \
            --tag "${IMAGE}:stable" \
            "${IMAGE}:${{ steps.src.outputs.tag }}"

      - name: Report
        if: github.event_name != 'schedule' || steps.matrix.outputs.green == 'true'
        run: |
          echo "ghcr.io/${{ github.repository }}:stable now points at ${{ steps.src.outputs.tag }}" \
            >> "$GITHUB_STEP_SUMMARY"
